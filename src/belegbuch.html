<title>FFH Bau und Büro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: einspaltig, Kopf mit drei Reitern (Übersicht, Belege, Aufträge), Formular als Blatt über der Liste, ab 640px zentriert */
:root {
  --bg: #eef1f2;
  --surface: #ffffff;
  --surface-2: #f5f7f8;
  --ink: #17222b;
  --muted: #566570;
  --line: #d3dade;
  --accent: #0f6b63;
  --accent-ink: #ffffff;
  --accent-soft: #dcefec;
  --fab: #1747a6;
  --fab-ink: #ffffff;
  --safe: #6b3fa0;
  --safe-soft: #efe7f8;
  --safe-ink: #ffffff;
  --good: #25703a;
  --good-soft: #dcefe1;
  --warn: #8a5207;
  --warn-soft: #f8ebd3;
  --bad: #b3372d;
  --bad-soft: #f7dedb;
  --scrim: rgba(12, 20, 26, 0.5);
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c;
    --surface: #1a232a;
    --surface-2: #212d35;
    --ink: #e6ecef;
    --muted: #93a2ad;
    --line: #2d3b44;
    --accent: #43b8aa;
    --accent-ink: #06201d;
    --accent-soft: #1b3a38;
    --fab: #7aa8ff;
    --fab-ink: #0a1b3d;
    --safe: #c4a3f0;
    --safe-soft: #2e2240;
    --safe-ink: #1d1030;
    --good: #6cc785;
    --good-soft: #1d3626;
    --warn: #e0a850;
    --warn-soft: #3b2f17;
    --bad: #f08a80;
    --bad-soft: #432522;
    --scrim: rgba(0, 0, 0, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c;
  --surface: #1a232a;
  --surface-2: #212d35;
  --ink: #e6ecef;
  --muted: #93a2ad;
  --line: #2d3b44;
  --accent: #43b8aa;
  --accent-ink: #06201d;
  --accent-soft: #1b3a38;
  --fab: #7aa8ff;
  --fab-ink: #0a1b3d;
  --safe: #c4a3f0;
  --safe-soft: #2e2240;
  --safe-ink: #1d1030;
  --good: #6cc785;
  --good-soft: #1d3626;
  --warn: #e0a850;
  --warn-soft: #3b2f17;
  --bad: #f08a80;
  --bad-soft: #432522;
  --scrim: rgba(0, 0, 0, 0.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 112px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
.wrap { max-width: 860px; margin: 0 auto; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
.trip { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.trip .field { margin-bottom: 0; }
.photofirst { padding: 12px; border: 1px dashed var(--accent); border-radius: 10px; background: var(--accent-soft); }
.photofirst .btn.primary { min-height: 52px; font-size: 16px; }

/* Kopf */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 14px 10px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.brand h1 { font-size: 22px; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand { justify-content: flex-start; align-items: center; }
.brand .back { flex: none; }
.mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto; }
.mtile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 112px; padding: 12px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font: inherit; text-align: center; cursor: pointer; }
.mtile:active { transform: scale(0.98); }
.mtile svg { width: 34px; height: 34px; color: var(--accent); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mtile b { font-size: 14px; line-height: 1.2; font-weight: 600; hyphens: manual; overflow-wrap: normal; }
.mtile small { font-size: 11.5px; line-height: 1.25; color: var(--muted); }
.mtile .cnt { position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; line-height: 22px; }
.mtile.safe { background: var(--safe-soft); border-color: var(--safe); }
.mtile.safe svg, .mtile.safe b { color: var(--safe); }
.mtile.alert { border-color: var(--bad); }
.mode { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tabs { display: flex; overflow-x: auto; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { flex: 1 0 auto; padding: 0 12px; font-size: 14px; min-height: 40px; border: 0; background: transparent; border-radius: 7px; font-weight: 500; color: var(--muted); cursor: pointer; }
.tabs button.tab-safe { background: var(--safe-soft); color: var(--safe); font-weight: 600; }
.tabs button.tab-safe[aria-current="page"] { background: var(--safe); color: var(--safe-ink); box-shadow: none; }
#v-sicherung .section-h { color: var(--safe); }
#v-sicherung .syncbox { border-color: var(--safe); }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Bausteine */
.btn { min-height: 44px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.stornobtn { flex: 1 1 100%; min-height: 48px; font-weight: 600; border: 2px solid var(--bad); }
.btn.cta { flex: 1 1 100%; min-height: 56px; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; box-shadow: 0 2px 0 rgba(0,0,0,0.18), 0 6px 14px rgba(15,107,99,0.28); }
.btn.cta:active { transform: translateY(1px); box-shadow: none; }
.btn.cta.armed { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn:disabled { opacity: 0.55; cursor: default; }
.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.pgrid figure { margin: 0; min-width: 0; }
.pgrid .pimg { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.pgrid .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.pgrid .pdel { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 99px; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; cursor: pointer; }
.pgrid figcaption { font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
canvas.sig { display: block; width: 100%; max-width: 420px; height: 130px; background: #fff; border: 1px dashed var(--muted); border-radius: 8px; touch-action: none; margin-bottom: 6px; }
.nk { width: 100%; border-collapse: collapse; font-size: 14px; }
.nk td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.nk td.num { text-align: right; white-space: nowrap; padding-left: 12px; }
.nk tr.sum td { font-weight: 600; }
.timer-on { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.badge.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }
.banner .btn { background: transparent; border-color: currentColor; color: inherit; }

/* Übersicht */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.tile.go { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; position: relative; }
.tile.go:hover { border-color: var(--accent); }
.tile.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile.go::after { content: '›'; position: absolute; right: 12px; top: 10px; font-size: 20px; color: var(--accent); line-height: 1; }
.bar-row.go { width: 100%; background: none; border: 0; padding: 4px 0; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: 6px; }
.bar-row.go:hover { background: var(--surface-2); }
.bar-row.go:focus-visible { outline: 2px solid var(--accent); }
.tile.wide { grid-column: 1 / -1; }
.tile.remind { padding: 8px 34px 8px 12px; border-color: var(--bad); background: var(--bad-soft); }
.tile.remind .t1 { font-size: 14px; font-weight: 600; color: var(--bad); line-height: 1.3; }
.tile.remind .t2 { font-size: 12px; color: var(--muted); line-height: 1.3; margin-top: 1px; }
.tile.remind::after { top: 50%; margin-top: -11px; color: var(--bad); }
.tile.remind.done { border-color: var(--good); background: var(--good-soft); }
.tile.remind.done .t1, .tile.remind.done::after { color: var(--good); }
.tile .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tile .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 21px; font-weight: 500; margin: 4px 0 2px; overflow-wrap: anywhere; }
.tile .sub { font-size: 13px; color: var(--muted); }
.section-h { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; margin: 22px 0 10px; }
.todo { display: flex; flex-direction: column; gap: 8px; }
.row.term { border-left: 5px solid var(--fab); }
.row.term.today { background: var(--accent-soft, var(--surface)); }
.row.term .when { font-weight: 600; color: var(--fab); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile.termtile { cursor: default; padding: 8px 12px; margin-top: 8px; border-left: 5px solid var(--line); }
.tile.termtile.on { border-left-color: var(--fab); }
.past { margin-top: 10px; }
.past summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }
.past .list { opacity: .75; }
.calrow { display: flex; flex-wrap: wrap; gap: 8px; }
.calrow a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.todo button { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; min-height: 48px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.todo .ok { padding: 12px 14px; background: var(--good-soft); color: var(--good); border-radius: 10px; }
.bars { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 9.5em) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 5px; }

/* Listen */
.controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.controls .wide { grid-column: 1 / -1; }
@media (min-width: 720px) { .controls { grid-template-columns: 1.4fr 1fr 1fr; } .controls .wide { grid-column: auto; } }
input[type="text"], input[type="date"], select {
  width: 100%; min-height: 44px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
}
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.listbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 10px; }
.listbar .sum { font-size: 14px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; }
.row:hover { border-color: var(--accent); }
.seg { display: flex; gap: 0; width: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1 1 0; min-width: 0; min-height: 46px; padding: 4px 6px; border: 0; border-right: 1px solid var(--line); background: transparent; font: inherit; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.seg button:last-child { border-right: 0; }
.seg button b { font-weight: 600; font-size: 14px; }
.seg button span { font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.grp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 14px 0 2px; padding-bottom: 4px; border-bottom: 2px solid var(--line); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.grp-h:first-child { margin-top: 0; }
.row.k-kunde { border-left: 5px solid var(--accent); }
.row.k-lieferant { border-left: 5px solid var(--warn); }
.kindtag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
.k-lieferant .kindtag { color: var(--warn); }
.row .main { flex: 1; min-width: 0; }
.row .vendor { font-weight: 600; overflow-wrap: anywhere; }
.row .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row .amt { text-align: right; flex: none; }
.row .amt .sub { font-size: 12px; color: var(--muted); }
.thumb { width: 48px; height: 48px; flex: none; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); background: var(--surface-2); }
#backupH { scroll-margin-top: 150px; }
.sheet.viewer { max-width: 900px; display: flex; flex-direction: column; height: 94%; }
.viewer-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.viewer-h h2 { margin: 0; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer-b { flex: 1; min-height: 0; overflow: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.viewer-b img { display: block; width: 100%; height: auto; }
.viewer-b img.zoom { width: 250%; max-width: none; }
.viewer-b iframe { display: block; width: 100%; height: 100%; min-height: 320px; border: 0; background: #fff; }
.syncbox { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.syncbox input[type=file] { width: 100%; min-height: 44px; }
.docname { font-weight: 600; min-height: 40px; }
.thumb.pdf { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.order { display: block; }
.order .top1 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.order .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.order select { width: auto; min-height: 36px; padding: 0 8px; font-size: 14px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }

.fab {
  display: block; width: 100%; max-width: 360px; margin: 12px auto 12px;
  min-height: 54px; padding: 0 20px; border-radius: 12px; border: 0;
  background: var(--fab); color: var(--fab-ink); font-weight: 700; font-size: 17px; cursor: pointer; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
}
.fab:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* Blatt */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim);
  display: flex; align-items: flex-end; justify-content: center;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
@media (min-width: 640px) { .overlay { align-items: center; padding: 24px; } }
.sheet { width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding: 18px 16px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .sheet { border-radius: 16px; } }
.sheet h2 { font-size: 19px; margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
.field label, .field .lbl { font-size: 13px; font-weight: 500; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .grid2.stack { grid-template-columns: 1fr; } }
.err { color: var(--bad); min-height: 1.2em; margin: 0 0 8px; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.actions .left { margin-right: auto; }
.photo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.photo .thumb { width: 64px; height: 64px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .row, .btn { transition: border-color 0.15s, background-color 0.15s; } }
.sheet.wide { max-width: 760px; }
.top .mode { margin-top: 8px; }
textarea { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; resize: vertical; line-height: 1.45; font: inherit; color: inherit; }
.pos { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; background: var(--surface-2); }
.pos .field { margin-bottom: 8px; }
.pos input, .pos select { background: var(--surface); }
.res { min-height: 44px; display: flex; align-items: center; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
.sumtable { width: 100%; max-width: 420px; margin-left: auto; border-collapse: collapse; margin-top: 12px; }
.sumtable td { padding: 4px 0; }
.sumtable td:last-child { text-align: right; }
.addbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.addbar select { flex: 1 1 220px; width: auto; min-width: 0; max-width: 100%; }
.prow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.prow .ptext { grid-column: 1 / -1; }
.prow .field { margin-bottom: 0; }
.sheet a { color: var(--accent); }
.sheet a.btn { color: var(--ink); text-decoration: none; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 10px; }
.pcard { padding: 10px; }
.pcard .pc-top { display: flex; gap: 8px; align-items: flex-start; }
.pcard .pc-nr { flex: none; width: 26px; height: 26px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-top: 8px; }

        return idbGet('files', id).then(function (rec) { return ocrBeleg(rec.blob, pdf); });
      }).catch(function () { renderPhotoBox('Die Datei ließ sich nicht übernehmen.'); });
    } else if (t.id === 'ph-file') { photoAdd(t.files[0]).then(function () { t.value = ''; });
    } else if (t.id === 'ordnerFile') {
      var g = t.files[0];
      addFile(g, g.name).then(function (id) { return persist('dokumente', null, { name: g.name, date: today(), note: '', fileId: id }); }).then(function () { t.value = ''; toast('PDF abgelegt'); }, function () { toast('Die Datei ließ sich nicht ablegen'); });
    }
  });
  document.addEventListener('change', function (e) { if (e.target && e.target.id === 'backupFile') { var bf = e.target.files && e.target.files[0]; restorePick(bf).then(function () { e.target.value = ''; }); } });
  document.addEventListener('change', function (e) { if (e.target && e.target.id === 'syncFile') { var f = e.target.files && e.target.files[0]; syncLoad(f).then(function () { e.target.value = ''; }); } });
  document.addEventListener('change', async function (e) {
    var t = e.target;
    if (draft && draft.sticky) return;
    if (t.id === 'ordnerName') { persist('settings', 'ordner', { name: String(t.value).trim() }).then(function () { toast('Ordnername gespeichert'); }, function () { toast('Das ließ sich nicht speichern'); }); return; }
    if (t.dataset && t.dataset.doc) { patch('dokumente', t.dataset.doc, { name: String(t.value).trim() }).then(function () { toast('Name gespeichert'); }, function () { toast('Das ließ sich nicht speichern'); }); return; }
    if (t.id === 'f-party' && draft && draft.coll === 'auftraege' && val('f-kind') === 'kunde') {
      var kk = kundeByName(t.value);
      if (kk) {
        if (!val('f-addr')) $('#f-addr').value = kk.address || ''; if (!val('f-email')) $('#f-email').value = kk.email || ''; $('#f-ckind').value = kk.ckind === 'privat' ? 'privat' : 'firma';
        if (!val('f-site') && kk.ckind === 'privat' && kk.address) { $('#f-site').value = kk.address; var fh = $('#siteFillHint'); if (!fh) { fh = document.createElement('p'); fh.className = 'hint'; fh.id = 'siteFillHint'; fh.style.margin = '4px 0 0'; $('#f-site').after(fh); } fh.textContent = 'Übernommen aus der Adresse des Kunden – bitte prüfen.'; }
        toast('Kundendaten übernommen');
      }
      renderSiteChips();
      return;
    }
    if (t.id === 'ab-result') { $('#ab-mWrap').hidden = t.value === 'ok'; return; }
    if (t.id === 'jahrSel') { state.jahr = t.value; renderJahr(); renderAbsenz(); return; }
    if (t.id === 'f-place' || t.id === 'f-vendor' || t.id === 'f-vaddr') { fillTrip(true); return; }
    if (t.id === 'f-back') { var kk = parseNum(val('f-km')); if (kk > 0) { $('#f-km').value = String(t.checked ? kk * 2 : kk / 2).replace('.', ','); } renderTrip(); return; }
    if (t.id === 'fb-month') { state.fb.month = t.value; renderBelege(); }
    else if (t.id === 'fb-cat') { state.fb.cat = t.value; renderBelege(); }
    else if (t.id === 'fb-nophoto') { state.fb.nophoto = t.checked; renderBelege(); }
    else if (t.id === 'fa-open') { state.fa.open = t.checked; faSave(); renderAuftraege(); }
    else if (t.id === 'f-kind') {
      $('#f-status').innerHTML = options(STAT[t.value], STAT[t.value][0]);
      var kd = t.value === 'kunde';
      $('#partyLbl').textContent = kd ? 'Kunde' : 'Händler / Lieferant';
      $('#amountLbl').textContent = kd ? 'Auftragswert netto (€)' : 'Betrag netto (€)';
      $('#siteWrap').hidden = !kd; $('#siteTripWrap').hidden = !kd; $('#hoursWrap').hidden = !kd; $('#photosWrap').hidden = !kd; $('#delaysWrap').hidden = !kd; $('#planWrap').hidden = !kd; $('#areaWrap').hidden = !kd; $('#kundeWrap').hidden = !kd;
    }
    else if (draft && draft.coll === 'auftraege' && (t.id === 'f-date' || t.id === 'f-terms')) {
      var tm = $('#f-terms').value;
      if (tm !== 'custom' && $('#f-date').value) $('#f-due').value = addDays($('#f-date').value, Number(tm));
    }
    else if (draft && draft.coll === 'auftraege' && t.id === 'f-due') { $('#f-terms').value = 'custom'; }
    else if (t.id === 'f-vendor' && draft && draft.coll === 'belege' && !draft.id) {
      var name = t.value.trim().toLowerCase();
      var prev = state.data.belege.filter(function (b) { return (b.vendor || '').toLowerCase() === name; }).sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); })[0];
      if (prev) { $('#f-cat').value = prev.cat; $('#f-vat').value = String(prev.vat); $('#f-pay').value = prev.pay; }
    }
    else if (t.dataset && t.dataset.astatus) {
      try {
        var ag = state.data.angebote.find(function (x) { return x.id === t.dataset.astatus; });
        await patch('angebote', t.dataset.astatus, { status: t.value });
        if (t.value === 'Angenommen' && ag) {
          var oa = auftrag(ag.auftragId);
          if (oa && (oa.status === 'Anfrage' || oa.status === 'Angebot')) await patch('auftraege', oa.id, { status: 'Beauftragt', amount: calcAng(ag).net2 });
        }
        toast('Status: ' + t.value);
      } catch (err) { toast('Status ließ sich nicht ändern'); render(); }
    }
    else if (t.dataset && t.dataset.status) {
      try { await patch('auftraege', t.dataset.status, { status: t.value }); toast('Status: ' + t.value); }
      catch (err) { toast('Status ließ sich nicht ändern'); render(); }
    }
  });

  /* ---------- 10 Start ---------- */
  function readHash() { var h = (location.hash || '').replace('#', ''); state.tab = TABS.indexOf(h) >= 0 ? h : 'menu'; }
  window.addEventListener('hashchange', function () { readHash(); render(); window.scrollTo(0, 0); });
  window.addEventListener('popstate', function () { readHash(); render(); window.scrollTo(0, 0); });

  /** Start: Dienste der Claude-Umgebung anfragen; wenn keine Datenbank da ist, lokal arbeiten. */
  async function init() {
    readHash();
    $('#fb-cat').innerHTML = '<option value="all">Alle Kategorien</option>' + options(CATS, '');
    render();
    function use(n) {
      if (!window.claude || !window.claude.use) return Promise.resolve(null);
      return window.claude.use(n).catch(function () { return null; });
    }
    var got = await Promise.all([use('db'), use('assets'), use('downloads'), use('mcp')]);
    ASSETS = got[1]; DL = got[2]; MAP = got[3];
    if (got[0]) {
      DB = got[0]; mode = 'db';
      setTimeout(function () { if (!allLoaded() && !state.err) { state.slow = true; renderMode(); } }, 10000);
      COLS.forEach(function (c) {
        DB.collection(c).onSnapshot(function (snap) {
          state.data[c] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
          state.loaded[c] = true; if (allLoaded()) state.slow = false;
          render();
        }, function () { state.err = true; render(); });
      });
    } else {
      mode = 'local'; loadLocal();
    }
    render();
    initBackup();
  }
  init();
})();
</script>
